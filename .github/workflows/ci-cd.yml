name: Validate and Deploy Lambda
on: [push, pull_request]
permissions: {contents: read}
jobs:
  check:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run gql:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - uses: aws-actions/setup-sam@v2
        with: {version: '1.165.0', use-installer: true}
      - run: sam validate --lint --template-file api/template.yaml
      - run: sam validate --lint --template-file api/deploy-bootstrap.yaml
      - run: npm run test:integration
      - name: Upload tested Lambda package
        id: bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: lambda-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            api/template.yaml
            api/dist/api.zip
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy Lambda
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: lambda-production-napl-api
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      AWS_CLOUDFORMATION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}
      AWS_DEPLOYMENT_BUCKET: ${{ vars.AWS_DEPLOYMENT_BUCKET }}
      SAM_CLI_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - uses: aws-actions/setup-sam@v2
        with: {version: '1.165.0', use-installer: true}
      - name: Download tested Lambda package
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.check.outputs.artifact-id }}
          path: api
      - name: Prepare protected deployment parameters
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COOKIE_KEYS: ${{ secrets.COOKIE_KEYS }}
          ORIGIN_SECRET: ${{ secrets.ORIGIN_SECRET }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_TRANSFER_WEBHOOK: ${{ secrets.DISCORD_TRANSFER_WEBHOOK }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_JWT_AUDIENCE: ${{ vars.SUPABASE_JWT_AUDIENCE || 'authenticated' }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
          VERCEL_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG }}
          VERCEL_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME }}
          EXISTING_VERCEL_OIDC_PROVIDER_ARN: ${{ vars.EXISTING_VERCEL_OIDC_PROVIDER_ARN }}
          APPLICATION_ROLE_BOUNDARY_ARN: ${{ vars.APPLICATION_ROLE_BOUNDARY_ARN }}
        run: |
          npm run env:sam
          install -m 600 api/.env.sam.json api/.env.sam.yaml
      - name: Skip commits superseded on main
        id: release
        run: |
          main_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ -z "$main_sha" ]; then
            echo '::error::Could not resolve the current main commit'
            exit 1
          fi
          if [ "$GITHUB_SHA" = "$main_sha" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Skipping deployment because main has a newer commit'
          fi
      - name: Obtain temporary AWS credentials
        if: steps.release.outputs.current == 'true'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '246230520992'
          role-session-name: napl-deploy-${{ github.run_id }}
      - name: Deploy application stack
        if: steps.release.outputs.current == 'true'
        run: |
          sam deploy \
            --template-file api/template.yaml \
            --stack-name napl-api \
            --region "$AWS_REGION" \
            --s3-bucket "$AWS_DEPLOYMENT_BUCKET" \
            --s3-prefix napl-api \
            --role-arn "$AWS_CLOUDFORMATION_ROLE_ARN" \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --parameter-overrides file://api/.env.sam.yaml \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
      - name: Smoke test deployed Lambda
        if: steps.release.outputs.current == 'true'
        env:
          ORIGIN_SECRET: ${{ secrets.ORIGIN_SECRET }}
        run: |
          FUNCTION_URL=$(aws cloudformation describe-stacks \
            --stack-name napl-api \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='FunctionUrl'].OutputValue | [0]" \
            --output text)
          node api/scripts/smoke-deploy.mjs \
            --function-name napl-api-api:live \
            --region "$AWS_REGION" \
            --url "$FUNCTION_URL"
      - name: Remove deployment parameters
        if: always()
        run: rm -f api/.env.sam.json api/.env.sam.yaml
