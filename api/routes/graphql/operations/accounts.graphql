fragment PublicAccountFields on Account {
  id
  username
  position
  teamId
  imageUrl
  country
  stats
  seasonStats
  ranking { score percentile ranked gamesPlayed tier }
  cardStats { season cells { label value } }
  awards
  championships
  totwUntil
  cheater
  strikersId
  steamUrl
  createdAt
}

query AccountMatches($id: ID!, $first: Int = 25, $after: String, $season: String, $opponent: String) {
  accountMatches(id: $id, first: $first, after: $after, season: $season, opponent: $opponent) {
    nodes
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}

query AccountOpponents($id: ID!, $first: Int = 10, $after: String) {
  accountOpponents(id: $id, first: $first, after: $after)
}

query AccountCardPreviews {
  accountCardPreviews {
    label
    description
    account { ...PublicAccountFields }
  }
}

query DefaultPositionWeights {
  defaultPositionWeights
}
