AWSTemplateFormatVersion: '2010-09-09'
Transform:
  - AWS::LanguageExtensions
  - AWS::Serverless-2016-10-31
Description: NAPL API Lambda function. Frontend hosting remains on Vercel.

Parameters:
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: PostgreSQL runtime connection URL for application queries and authentication state.
  SupabaseUrl:
    Type: String
    Description: Supabase project URL, or the Auth base URL for a standalone service.
  SupabasePublishableKey:
    Type: String
    Description: Supabase publishable key used for Auth requests.
  SupabaseSecretKey:
    Type: String
    NoEcho: true
    MinLength: 1
    AllowedPattern: '\S+'
    Description: Server-only Supabase secret key for managed Storage uploads and private signed URLs.
  SupabaseJwksUrl:
    Type: String
    Description: Complete HTTPS URL of the Supabase Auth public signing keys endpoint.
  PublicOrigin:
    Type: String
    Description: Exact public Vercel site origin, including https scheme.
  CloudFrontDistributionId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Z0-9]+$'
  CloudFrontDomainName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9]+\.cloudfront\.net$'
  RolePermissionsBoundaryArn:
    Type: String
    AllowedPattern: '^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:policy/[A-Za-z0-9+=,.@_/-]+$'
    Description: ApplicationRoleBoundaryArn output from the deployment bootstrap stack.
  DiscordTransferWebhook:
    Type: String
    NoEcho: true
    Default: ''
    Description: Optional Discord webhook URL.
  ReservedConcurrency:
    Type: Number
    Default: -1
    MinValue: -1
    MaxValue: 1000
    Description: '-1 uses the account concurrency pool; 0 disables invocation; positive values reserve concurrency.'
  FunctionMemorySize:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 10240
  FunctionTimeout:
    Type: Number
    Default: 60
    MinValue: 1
    MaxValue: 900

Conditions:
  HasCloudFront: !Not [!Equals [!Ref CloudFrontDistributionId, '']]
  DirectIngress: !Equals [!Ref CloudFrontDistributionId, '']
  HasDiscordTransferWebhook: !Not [!Equals [!Ref DiscordTransferWebhook, '']]
  HasReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrency, -1]]

Resources:
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-api
      RetentionInDays: 14

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Ref RolePermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteFunctionLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub ${ApiLogGroup.Arn}:*

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn-lint:
        config:
          # -1 removes the property through HasReservedConcurrency; Lambda never receives it.
          ignore_checks: [E3034]
    Properties:
      CodeUri: dist/api.zip
      FunctionName: !Sub ${AWS::StackName}-api
      Handler: lambda.handler
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: INFO
      Runtime: nodejs24.x
      Architectures: [arm64]
      AutoPublishAlias: live
      AutoPublishAliasAllProperties: true
      FunctionUrlConfig:
        AuthType: !If [HasCloudFront, AWS_IAM, NONE]
        InvokeMode: BUFFERED
      MemorySize: !Ref FunctionMemorySize
      Timeout: !Ref FunctionTimeout
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref ReservedConcurrency, !Ref AWS::NoValue]
      Role: !GetAtt ApiRole.Arn
      Environment:
        Variables:
          NODE_ENV: production
          TRUST_CLOUDFRONT: !If [HasCloudFront, 'true', 'false']
          DATABASE_URL: !Ref DatabaseUrl
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_PUBLISHABLE_KEY: !Ref SupabasePublishableKey
          SUPABASE_JWKS_URL: !Ref SupabaseJwksUrl
          SUPABASE_SECRET_KEY: !Ref SupabaseSecretKey
          PUBLIC_ORIGIN: !Ref PublicOrigin
          DISCORD_TRANSFER_WEBHOOK: !If [HasDiscordTransferWebhook, !Ref DiscordTransferWebhook, !Ref AWS::NoValue]

  DirectUrlPermission:
    Type: AWS::Lambda::Permission
    Condition: DirectIngress
    Properties:
      FunctionName: !Ref ApiFunction.Alias
      Principal: '*'
      Action: lambda:InvokeFunctionUrl
      FunctionUrlAuthType: NONE

  DirectInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: DirectIngress
    Properties:
      FunctionName: !Ref ApiFunction.Alias
      Principal: '*'
      Action: lambda:InvokeFunction
      InvokedViaFunctionUrl: true

  CloudFrontUrlPermission:
    Type: AWS::Lambda::Permission
    Condition: HasCloudFront
    Properties:
      FunctionName: !Ref ApiFunction.Alias
      Principal: cloudfront.amazonaws.com
      Action: lambda:InvokeFunctionUrl
      FunctionUrlAuthType: AWS_IAM
      SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistributionId}

  CloudFrontInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: HasCloudFront
    Properties:
      FunctionName: !Ref ApiFunction.Alias
      Principal: cloudfront.amazonaws.com
      Action: lambda:InvokeFunction
      InvokedViaFunctionUrl: true
      SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistributionId}

Outputs:
  ApiUrl:
    Description: Public API URL for the matching frontend build.
    Value: !If [HasCloudFront, !Sub 'https://${CloudFrontDomainName}', !GetAtt ApiFunctionUrl.FunctionUrl]
  FunctionUrl:
    Description: Underlying Lambda origin URL; use ApiUrl for the frontend.
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
