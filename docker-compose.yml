name: napl-local

services:
  lambda:
    platform: linux/arm64
    build:
      context: .
      dockerfile: api/Dockerfile
      target: lambda
    env_file: ./api/.env
    environment:
      AWS_EC2_METADATA_DISABLED: "true"
    ports:
      - "127.0.0.1:9000:8080"
    volumes:
      - type: bind
        source: ./api/prod-ca-2021.crt
        target: /var/task/prod-ca-2021.crt
        read_only: true
        bind:
          create_host_path: false

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: adapter
    depends_on:
      lambda: {condition: service_started}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      api: {condition: service_healthy}
    env_file: ./web/.env
    environment:
      LOCAL_API_URL: http://api:3000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./web/src:/app/web/src:ro
